<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Drag and Drop - Carro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Meu Carro</h1>

    <p>Arraste o carro até a garagem.</p>

    <div class="container">

        <div 
            class="carro"  id="carro" draggable="true">
            🚗 Carro
        </div>

        <div 
            class="garagem" id="garagem">
            🏠 Garagem

        </div>

    </div>

    <p id="mensagem"></p>

    <script src="script.js"></script>

</body>

</html>
